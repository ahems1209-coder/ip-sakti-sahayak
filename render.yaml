services:
  - type: web
    name: ip-sakti-sahayak-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: DEMO_MODE
        value: true
